<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Sound Machine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="keys">
    <div data-key="65" class="key">
      <kbd>A</kbd>
      <span class="sound">Woah</span>
    </div>
    <div data-key="83" class="key">
      <kbd>S</kbd>
      <span class="sound">So Dum</span>
    </div>
    <div data-key="68" class="key">
      <kbd>D</kbd>
      <span class="sound">PIR LOSE</span>
    </div>
    <div data-key="70" class="key">
      <kbd>F</kbd>
      <span class="sound">Air Horn</span>
    </div>
    <div data-key="71" class="key">
      <kbd>G</kbd>
      <span class="sound">Nice</span>
    </div>
    <div data-key="72" class="key">
      <kbd>H</kbd>
      <span class="sound">NO!</span>
    </div>
    <div data-key="74" class="key">
      <kbd>J</kbd>
      <span class="sound">doh</span>
    </div>
    <div data-key="75" class="key">
      <kbd>K</kbd>
      <span class="sound">Sad</span>
    </div>
    <div data-key="76" class="key">
      <kbd>L</kbd>
      <span class="sound">Last Day</span>
    </div>
  </div>

  <audio data-key="65" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/Woah.mp3"></audio>
  <audio data-key="83" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/So Dum.m4a"></audio>
  <audio data-key="68" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/Price-is-right-losing-horn.mp3"></audio>
  <audio data-key="70" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/Air Horn.mp3"></audio>
  <audio data-key="71" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/nice.wav"></audio>
  <audio data-key="72" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/no.mp3"></audio>
  <audio data-key="74" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/doh.mp3"></audio>
  <audio data-key="75" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/sadtrombone.mp3"></audio>
  <audio data-key="76" src="https://lhasper.github.io/JavaScriptDrumKit/sounds/AnotherOneBitesTHeDust.mp3"></audio>

<script>
  function removeTransition(e) {
    if (e.propertyName !== 'transform') return;
    e.target.classList.remove('playing');
  }

  function playSound(e) {
    const audio = document.querySelector(`audio[data-key="${e.keyCode}"]`);
    const key = document.querySelector(`div[data-key="${e.keyCode}"]`);
    if (!audio) return;

    key.classList.add('playing');
    audio.currentTime = 0;
    audio.play();
  }


  const keys = Array.from(document.querySelectorAll('.key'));
  keys.forEach(key => key.addEventListener('transitionend', removeTransition));
  window.addEventListener('keydown', playSound);
</script>


</body>
</html>
